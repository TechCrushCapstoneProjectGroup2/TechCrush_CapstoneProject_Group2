name: Bug
description: Something built is not behaving as designed
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: Symptom and how observed (command/output)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour (link the design decision)
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["Blocker", "Major", "Minor"]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence location (evidence/... or logs)
    validations:
      required: false
